<script>
  const text = "HAPPY BIRTHDAY VINAYAK💕❤️";
  let index = 0;

  function type() {
    if (index < text.length) {
      document.getElementById("typewriter").innerHTML += text.charAt(index);
      index++;
      setTimeout(type, 100); // Speed in milliseconds per character
    }
  }

  type();
</script>
